// ===== Keyboard =====
document.addEventListener('keydown', e => {
  // Don't capture if typing in inputs
  if (e.target.matches('input, textarea')) return;
  const l = currentLayer();
  if (!l) return;
  const step = e.shiftKey ? 10 : 1;
  switch (e.key) {
    case 'ArrowLeft': l.cx -= step / state.view.scale; render(); syncPropsInputs(); e.preventDefault(); break;
    case 'ArrowRight': l.cx += step / state.view.scale; render(); syncPropsInputs(); e.preventDefault(); break;
    case 'ArrowUp': l.cy -= step / state.view.scale; render(); syncPropsInputs(); e.preventDefault(); break;
    case 'ArrowDown': l.cy += step / state.view.scale; render(); syncPropsInputs(); e.preventDefault(); break;
    case 'Delete': case 'Backspace': removeLayer(l.id); e.preventDefault(); break;
  }
});

// ===== FFT (Cooley-Tukey, in-place, size must be power of 2) =====
function fft1d(re, im, inverse) {
  const n = re.length;
  // bit-reversal permutation
  let j = 0;
  for (let i = 0; i < n - 1; i++) {
    if (i < j) {
      let t = re[i]; re[i] = re[j]; re[j] = t;
      t = im[i]; im[i] = im[j]; im[j] = t;
    }
    let m = n >> 1;
    while (m > 0 && j >= m) { j -= m; m >>= 1; }
    j += m;
  }
  // butterflies
  for (let len = 2; len <= n; len <<= 1) {
    const half = len >> 1;
    const angle = (inverse ? 2 : -2) * Math.PI / len;
    const wReal = Math.cos(angle);
    const wImag = Math.sin(angle);
    for (let i = 0; i < n; i += len) {
      let wr = 1, wi = 0;
      for (let k = 0; k < half; k++) {
        const ar = re[i + k], ai = im[i + k];
        const br = re[i + k + half] * wr - im[i + k + half] * wi;
        const bi = re[i + k + half] * wi + im[i + k + half] * wr;
        re[i + k] = ar + br;
        im[i + k] = ai + bi;
        re[i + k + half] = ar - br;
        im[i + k + half] = ai - bi;
        const newWr = wr * wReal - wi * wImag;
        wi = wr * wImag + wi * wReal;
        wr = newWr;
      }
    }
  }
  if (inverse) {
    for (let i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
  }
}

function fft2d(re, im, w, h, inverse) {
  const rowRe = new Float32Array(w), rowIm = new Float32Array(w);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) { rowRe[x] = re[y*w+x]; rowIm[x] = im[y*w+x]; }
    fft1d(rowRe, rowIm, inverse);
    for (let x = 0; x < w; x++) { re[y*w+x] = rowRe[x]; im[y*w+x] = rowIm[x]; }
  }
  const colRe = new Float32Array(h), colIm = new Float32Array(h);
  for (let x = 0; x < w; x++) {
    for (let y = 0; y < h; y++) { colRe[y] = re[y*w+x]; colIm[y] = im[y*w+x]; }
    fft1d(colRe, colIm, inverse);
    for (let y = 0; y < h; y++) { re[y*w+x] = colRe[y]; im[y*w+x] = colIm[y]; }
  }
}

// Phase correlation: returns the buffer-pixel shift (dx, dy) and peak height.
// `subpixel: true` refines (dx, dy) to fractional accuracy via parabolic fit
// on the 3×3 correlation neighborhood around the integer peak. This is the
// classic sub-pixel registration trick — usually accurate to ~0.05 pixels
// for well-correlated images.
function phaseCorrelation(buf1, buf2, w, h, refFFT, subpixel) {
  const n = w * h;
  let re1, im1;
  if (refFFT) {
    re1 = refFFT.re; im1 = refFFT.im;
  } else {
    re1 = new Float32Array(n); im1 = new Float32Array(n);
    applyHannAndFFT(buf1, re1, im1, w, h);
  }
  const re2 = new Float32Array(n), im2 = new Float32Array(n);
  applyHannAndFFT(buf2, re2, im2, w, h);
  const cr = new Float32Array(n), ci = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const ar = re1[i], ai = im1[i];
    const br = re2[i], bi = -im2[i];
    const xr = ar * br - ai * bi;
    const xi = ar * bi + ai * br;
    const mag = Math.sqrt(xr * xr + xi * xi) + 1e-10;
    cr[i] = xr / mag;
    ci[i] = xi / mag;
  }
  fft2d(cr, ci, w, h, true);
  let maxV = -Infinity, maxI = 0;
  for (let i = 0; i < n; i++) {
    if (cr[i] > maxV) { maxV = cr[i]; maxI = i; }
  }
  const px = maxI % w;
  const py = Math.floor(maxI / w);
  let dx = px, dy = py;

  let subX = 0, subY = 0;
  if (subpixel) {
    // Sample 3 neighbors along each axis with wrap-around — the correlation
    // surface is periodic so we can index safely modulo w/h.
    const at = (x, y) => cr[((y + h) % h) * w + ((x + w) % w)];
    const c = cr[maxI];
    const xm = at(px - 1, py), xp = at(px + 1, py);
    const ym = at(px, py - 1), yp = at(px, py + 1);
    // Parabolic-fit vertex: for samples y0, y1, y2 at offsets -1, 0, +1,
    // the vertex offset is (y0 - y2) / (2*(y0 + y2 - 2*y1)).
    const denomX = 2 * (xm + xp - 2 * c);
    const denomY = 2 * (ym + yp - 2 * c);
    if (Math.abs(denomX) > 1e-9) subX = (xm - xp) / denomX;
    if (Math.abs(denomY) > 1e-9) subY = (ym - yp) / denomY;
    if (subX < -1 || subX > 1) subX = 0;
    if (subY < -1 || subY > 1) subY = 0;
  }
  // Unwrap to signed shift in (-w/2, w/2]
  if (dx >= w / 2) dx -= w;
  if (dy >= h / 2) dy -= h;
  return { dx: dx + subX, dy: dy + subY, peak: maxV };
}

function applyHannAndFFT(buf, re, im, w, h) {
  for (let y = 0; y < h; y++) {
    const wy = 0.5 * (1 - Math.cos(2 * Math.PI * y / (h - 1)));
    for (let x = 0; x < w; x++) {
      const wx = 0.5 * (1 - Math.cos(2 * Math.PI * x / (w - 1)));
      re[y*w+x] = buf[y*w+x] * wx * wy;
    }
  }
  fft2d(re, im, w, h, false);
}

// Sobel edge magnitude — emphasizes structural features, makes alignment robust
// to overall brightness/contrast differences and reduces the impact of large flat
// (background) regions.
function sobelEdges(buf, w, h) {
  const out = new Float32Array(w * h);
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      const a = buf[i - w - 1], b = buf[i - w], c = buf[i - w + 1];
      const d = buf[i - 1],                       e = buf[i + 1];
      const f = buf[i + w - 1], g = buf[i + w],  hh = buf[i + w + 1];
      const gx = (c + 2*e + hh) - (a + 2*d + f);
      const gy = (f + 2*g + hh) - (a + 2*b + c);
      out[i] = Math.sqrt(gx*gx + gy*gy);
    }
  }
  return out;
}

// Masked cosine similarity. Aligned-by-phase-correlation: with our FFT
// convention, peak t means buf2 = shift(buf1, t), so the aligned buf2
// sample at position (y, x) is buf2[y - dy, x - dx].
//
// We score *only* pixels where the moving layer (buf2) has meaningful
// content (above MASK_THRESHOLD). This is the key to handling partial
// overlap: when the moving layer is a zoomed sub-region of the reference,
// most of the buffer is "outside" the moving layer's footprint — those
// empty pixels would otherwise dilute the score with zeros and let a
// totally wrong (rot, scale) candidate win because its smaller footprint
// happened to dodge more reference edges. Masking restricts the score
// to "for each edge pixel the moving layer actually carries, how well
// does the reference's edge map at the corresponding position?".
function alignmentScore(buf1, buf2, w, h, dx, dy) {
  const MASK_THRESHOLD = 0.02;
  let dot = 0, e1 = 0, e2 = 0, n = 0, nFg = 0;
  for (let y = 0; y < h; y++) {
    const y2 = y - dy;
    if (y2 < 0 || y2 >= h) continue;
    for (let x = 0; x < w; x++) {
      const x2 = x - dx;
      if (x2 < 0 || x2 >= w) continue;
      const v2 = buf2[y2 * w + x2];
      if (v2 < MASK_THRESHOLD) continue;
      const v1 = buf1[y * w + x];
      dot += v1 * v2;
      e1 += v1 * v1;
      e2 += v2 * v2;
      nFg++;
    }
  }
  if (nFg < 100 || e1 < 1e-6 || e2 < 1e-6) return -1;
  const cos = dot / (Math.sqrt(e1 * e2) + 1e-10);
  // Reliability factor: penalize small-mask candidates. When the moving
  // layer's footprint in the buffer is tiny (heavy zoom-out, scale near
  // 0), the masked cosine can score surprisingly high just because the
  // few mask pixels happened to coincide with dense reference edges by
  // chance. Requiring the mask to cover at least ~4% of the buffer makes
  // partial-overlap alignment prefer candidates where the moving layer
  // actually has enough content for the match to be statistically
  // meaningful. (Verified on the overlay-test case: at 1% the fake
  // scale=0.45 basin beats truth; at 4% truth wins.)
  const reliability = Math.min(1, nFg / (w * h * 0.04));
  return cos * reliability;
}

// ===== Auto-overlay =====
// Renders the layer (with given extra rotation/scale applied about refCenter in world space)
// into a grayscale Float32Array of size SIZE×SIZE.
function renderLayerToGrayBuffer(layer, refCenter, worldHalfExtent, size, extraRot = 0, extraScale = 1) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, size, size);
  const ppu = size / (2 * worldHalfExtent); // buffer pixels per world unit
  // Transform: buffer pixel = ppu*(world - refCenter) + size/2
  ctx.translate(size / 2, size / 2);
  ctx.scale(ppu, ppu);
  // Now world coords centered on refCenter
  ctx.scale(extraScale, extraScale);
  ctx.rotate(extraRot);
  ctx.translate(layer.cx - refCenter.x, layer.cy - refCenter.y);
  ctx.rotate(layer.rotation);
  ctx.scale(layer.scale, layer.scale);
  ctx.drawImage(layer.processedBitmap, -layer.naturalW / 2, -layer.naturalH / 2);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const data = ctx.getImageData(0, 0, size, size).data;
  const buf = new Float32Array(size * size);
  for (let i = 0; i < buf.length; i++) {
    const r = data[i*4], g = data[i*4+1], b = data[i*4+2], a = data[i*4+3];
    // Luminance, modulated by alpha so transparent areas don't contribute
    const lum = 0.299 * r + 0.587 * g + 0.114 * b;
    buf[i] = (lum / 255) * (a / 255);
  }
  return { buf, ppu };
}

// Build the helpers needed to evaluate one (rotDeg, scl) candidate at a given
// buffer size. Reference's Sobel-edge FFT is precomputed once.
function buildEvaluator(ref, sel, refCenter, halfExtent, size) {
  const { buf: refGray, ppu } = renderLayerToGrayBuffer(ref, refCenter, halfExtent, size, 0, 1);
  const refEdges = sobelEdges(refGray, size, size);
  const refRe = new Float32Array(size * size), refIm = new Float32Array(size * size);
  applyHannAndFFT(refEdges, refRe, refIm, size, size);
  const refFFT = { re: refRe, im: refIm };
  return {
    ppu,
    eval(rotDeg, scl) {
      const { buf: moveGray } = renderLayerToGrayBuffer(sel, refCenter, halfExtent, size, rotDeg * Math.PI / 180, scl);
      const moveEdges = sobelEdges(moveGray, size, size);
      const { dx, dy } = phaseCorrelation(null, moveEdges, size, size, refFFT);
      // Score on Sobel edges, not raw grayscale: flat regions (white
      // background) contribute zero, so the metric measures only how well
      // structural edges line up. Critical for partial-overlap cases where
      // a small zoomed sub-region must align to one part of a larger plan.
      const score = alignmentScore(refEdges, moveEdges, size, size, dx, dy);
      return { rotDeg, scale: scl, dx, dy, score };
    },
    evalSubpixel(rotDeg, scl) {
      const { buf: moveGray } = renderLayerToGrayBuffer(sel, refCenter, halfExtent, size, rotDeg * Math.PI / 180, scl);
      const moveEdges = sobelEdges(moveGray, size, size);
      const { dx, dy } = phaseCorrelation(null, moveEdges, size, size, refFFT, true);
      const score = alignmentScore(refEdges, moveEdges, size, size, Math.round(dx), Math.round(dy));
      return { rotDeg, scale: scl, dx, dy, score };
    },
  };
}

// Auto-overlay is built around iterative refinement: a single pass picks a
// rotation/scale grid winner, parabolically refines it, and applies the
// sub-pixel translation. The outer loop just calls passes until either nothing
// is moving (converged), the user clicks Stop, or we hit 10 passes.
//
// Pass 1 is "broad" — sweeps the full ±180° rotation space and a wide range
// of scales at SIZE=128 so it can find the right basin from any starting
// state. Passes 2+ are "refine" — a tight local grid at SIZE=512 with a
// halfExtent cropped to 1/3 of the layer bbox, so each buffer pixel covers
// only a few source pixels and the sub-pixel parabolic fit translates to
// fractional-world-pixel accuracy.
//
// Between passes we run a small "snap" probe: try the nearest round values
// for translation/rotation/scale and keep whichever scores best. When the
// algorithm has converged near a clean architectural value (0°, integer
// pixels, scale 1.0), this often catches the true optimum that the FFT
// landscape's noise floor obscured.

let autoOverlayAbort = false;

function layerBBoxWorld(l) {
  const hw = l.naturalW / 2, hh = l.naturalH / 2;
  let mnX = Infinity, mnY = Infinity, mxX = -Infinity, mxY = -Infinity;
  for (const [lx, ly] of [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]]) {
    const w = layerLocalToWorld(l, lx, ly);
    if (w.x < mnX) mnX = w.x; if (w.y < mnY) mnY = w.y;
    if (w.x > mxX) mxX = w.x; if (w.y > mxY) mxY = w.y;
  }
  return { minX: mnX, minY: mnY, maxX: mxX, maxY: mxY };
}

function computeRefCenterAndExtent(ref, sel, tight) {
  const refBB = layerBBoxWorld(ref), selBB = layerBBoxWorld(sel);
  const refCenter = { x: (refBB.minX + refBB.maxX) / 2, y: (refBB.minY + refBB.maxY) / 2 };
  if (tight) {
    const r = Math.min(ref.naturalW, ref.naturalH) * ref.scale / 3;
    return { refCenter, halfExtent: Math.max(120, r) };
  }
  const refRad = Math.max(refBB.maxX - refBB.minX, refBB.maxY - refBB.minY) / 2;
  const selRad = Math.max(selBB.maxX - selBB.minX, selBB.maxY - selBB.minY) / 2;
  const dCenters = Math.hypot(
    (selBB.minX + selBB.maxX) / 2 - refCenter.x,
    (selBB.minY + selBB.maxY) / 2 - refCenter.y,
  );
  return { refCenter, halfExtent: Math.max(refRad, selRad + dCenters) * 1.4 };
}

// Compose (Drot, Dscale, dxW, dyW) about refCenter onto the layer's current state.
function applyTransformToLayer(sel, refCenter, Drot, Dscale, dxW, dyW) {
  const nx = sel.cx - refCenter.x, ny = sel.cy - refCenter.y;
  const cs = Math.cos(Drot), sn = Math.sin(Drot);
  let rx = nx * cs - ny * sn, ry = nx * sn + ny * cs;
  rx *= Dscale; ry *= Dscale;
  sel.cx = refCenter.x + rx + dxW;
  sel.cy = refCenter.y + ry + dyW;
  sel.rotation += Drot;
  sel.scale *= Dscale;
  while (sel.rotation > Math.PI) sel.rotation -= 2 * Math.PI;
  while (sel.rotation <= -Math.PI) sel.rotation += 2 * Math.PI;
}

// One pass: grid search + parabolic refine + sub-pixel translation. Mode
// selects between a broad initial sweep and a tight local search.
async function autoOverlayPass(ref, sel, mode, statusPrefix) {
  const tight = mode === 'refine';
  const { refCenter, halfExtent } = computeRefCenterAndExtent(ref, sel, tight);
  // 256 for broad gives small/zoomed layers enough buffer footprint to
  // phase-correlate reliably; 512 for refine for sub-pixel precision.
  const size = mode === 'broad' ? 256 : 512;
  const ev = buildEvaluator(ref, sel, refCenter, halfExtent, size);

  // Grid. Broad mode sweeps the full rotation space at coarse resolution to
  // find the basin from any starting state. Refine mode does a tight local
  // search; since the outer loop iterates, each refine only needs to make a
  // small step.
  let rots, scales;
  if (mode === 'broad') {
    rots = [];
    for (let r = -180; r < 180; r += 5) rots.push(r);
    // Cover both "zoom out" (sub-0.5) and "zoom in" (>2.5) factors so
    // partial-overlap cases — where the moving layer is a zoomed crop of
    // the reference (or vice versa) — get a candidate scale near the
    // truth in the broad pass.
    scales = [0.2, 0.27, 0.35, 0.45, 0.58, 0.72, 0.85, 0.94, 1.0, 1.06, 1.18, 1.4, 1.7, 2.15, 2.8, 3.7, 5.0];
  } else {
    rots = [-0.6, -0.2, -0.05, 0, 0.05, 0.2, 0.6];
    scales = [0.997, 0.999, 1.0, 1.001, 1.003];
  }

  let best = { score: -Infinity, rotDeg: 0, scale: 1, dx: 0, dy: 0 };
  // Broad mode keeps all candidates so we can re-rank them; refine mode
  // only tracks the running winner.
  const allCandidates = mode === 'broad' ? [] : null;
  const total = rots.length * scales.length;
  let done = 0;
  for (const r of rots) {
    for (const s of scales) {
      if (autoOverlayAbort) return null;
      done++;
      if (done % 12 === 0) {
        showStatus(`${statusPrefix} (${done}/${total})`, done / total * 0.55);
        await sleep(0);
      }
      const cand = ev.eval(r, s);
      if (cand.score > best.score) best = cand;
      if (allCandidates) allCandidates.push(cand);
    }
  }

  // Top-K re-rank for broad pass with fine sub-scale search. The broad
  // evaluator (SIZE=256, large halfExtent) is necessary for speed but its
  // gappy scale grid (×1.4 ratios) misses narrow basins where the right
  // scale lies between two grid points. For each top-K (rotDeg, scale)
  // winner from broad, we apply just rot+scale (NOT the broad's coarse
  // translation), and at the refine evaluator (SIZE=512, tight halfExtent)
  // we sweep a fine scale multiplier (±20% in 7 steps) — at each, the
  // refine PC finds a fresh translation. The (rot, scale) combo with the
  // best refine score wins, and the refine's translation is what gets
  // applied. This routinely promotes a true-basin candidate from rank
  // ~50 in broad to rank 1 once seen at higher resolution.
  if (mode === 'broad' && allCandidates) {
    allCandidates.sort((a, b) => b.score - a.score);
    // Build the rerank pool: top K globally + top-1 from each rotation
    // bucket. Bucketing guarantees diverse-rotation coverage so a true
    // basin at e.g. -90° doesn't get crowded out by 25 lookalike candidates
    // at -120°. Without this, partial-overlap rotations buried at rank 50+
    // never get the sub-scale verify treatment.
    const K = Math.min(15, allCandidates.length);
    const seen = new Set();
    const top = [];
    for (let i = 0; i < K; i++) {
      const c = allCandidates[i];
      const key = `${c.rotDeg}_${c.scale}`;
      if (!seen.has(key)) { top.push(c); seen.add(key); }
    }
    // 20°-wide rotation buckets — 18 buckets cover the ±180° range.
    const rotBuckets = new Map();
    for (const c of allCandidates) {
      const bucket = Math.floor((c.rotDeg + 180) / 20);
      const cur = rotBuckets.get(bucket);
      if (!cur || c.score > cur.score) rotBuckets.set(bucket, c);
    }
    for (const c of rotBuckets.values()) {
      const key = `${c.rotDeg}_${c.scale}`;
      if (!seen.has(key)) { top.push(c); seen.add(key); }
    }
    // Force-include cardinal rotations: architects often rotate by exactly
    // 0/±90/±180°, and the broad pass's best scale at each such rotation
    // is a prime candidate for the sub-scale verify search. Without this,
    // a non-cardinal candidate at a bucket boundary can hide the true
    // cardinal answer.
    const cardinalRots = [0, 90, -90, 180, -180];
    for (const cardinal of cardinalRots) {
      const atCard = allCandidates.filter(c => c.rotDeg === cardinal);
      atCard.sort((a, b) => b.score - a.score);
      for (let i = 0; i < Math.min(2, atCard.length); i++) {
        const c = atCard[i];
        const key = `${c.rotDeg}_${c.scale}`;
        if (!seen.has(key)) { top.push(c); seen.add(key); }
      }
    }
    const subScaleMul = [0.85, 0.92, 0.96, 1.0, 1.04, 1.09, 1.18];
    const refineHE = Math.max(120, Math.min(ref.naturalW, ref.naturalH) * ref.scale / 3);
    const verifyEv = buildEvaluator(ref, sel, refCenter, refineHE, 512);
    const savedSel = { cx: sel.cx, cy: sel.cy, rotation: sel.rotation, scale: sel.scale };
    let bestVerified = null;
    const totalVerify = top.length * subScaleMul.length;
    let doneVerify = 0;
    for (let i = 0; i < top.length; i++) {
      const cand = top[i];
      for (const mul of subScaleMul) {
        if (autoOverlayAbort) { sel.cx = savedSel.cx; sel.cy = savedSel.cy; sel.rotation = savedSel.rotation; sel.scale = savedSel.scale; return null; }
        doneVerify++;
        if (doneVerify % 8 === 0) {
          showStatus(`${statusPrefix} (verify ${doneVerify}/${totalVerify})`, 0.55 + 0.25 * doneVerify / totalVerify);
          await sleep(0);
        }
        const subScale = cand.scale * mul;
        sel.cx = savedSel.cx; sel.cy = savedSel.cy; sel.rotation = savedSel.rotation; sel.scale = savedSel.scale;
        applyTransformToLayer(sel, refCenter, cand.rotDeg * Math.PI / 180, subScale, 0, 0);
        const v = verifyEv.eval(0, 1);
        if (!bestVerified || v.score > bestVerified.verifyScore) {
          bestVerified = {
            rotDeg: cand.rotDeg,
            scale: subScale,
            dxW: v.dx / verifyEv.ppu,
            dyW: v.dy / verifyEv.ppu,
            verifyScore: v.score,
          };
        }
      }
    }
    sel.cx = savedSel.cx; sel.cy = savedSel.cy; sel.rotation = savedSel.rotation; sel.scale = savedSel.scale;
    if (bestVerified) {
      // Express dx/dy back in broad-buffer pixels (ev.ppu) so the parabolic
      // fit + sub-pixel steps that follow are consistent.
      best = {
        rotDeg: bestVerified.rotDeg,
        scale: bestVerified.scale,
        dx: bestVerified.dxW * ev.ppu,
        dy: bestVerified.dyW * ev.ppu,
        score: bestVerified.verifyScore,
      };
    }
  }

  // Parabolic fit on rotation & scale (5 extra evals)
  const drProbe = mode === 'broad' ? 1.0 : 0.04;
  const dsProbe = mode === 'broad' ? 0.01 : 0.001;
  const sC = ev.eval(best.rotDeg, best.scale).score;
  const sRm = ev.eval(best.rotDeg - drProbe, best.scale).score;
  const sRp = ev.eval(best.rotDeg + drProbe, best.scale).score;
  const sSm = ev.eval(best.rotDeg, best.scale * (1 - dsProbe)).score;
  const sSp = ev.eval(best.rotDeg, best.scale * (1 + dsProbe)).score;
  let subRot = 0, subScale = 0;
  const dnR = 2 * (sRm + sRp - 2 * sC);
  const dnS = 2 * (sSm + sSp - 2 * sC);
  if (Math.abs(dnR) > 1e-9) {
    const o = (sRm - sRp) / dnR;
    if (o > -1.5 && o < 1.5) subRot = o * drProbe;
  }
  if (Math.abs(dnS) > 1e-9) {
    const o = (sSm - sSp) / dnS;
    if (o > -1.5 && o < 1.5) subScale = o * dsProbe * best.scale;
  }

  // Sub-pixel translation at the parabolically-refined rot/scale
  showStatus(`${statusPrefix} (sub-pixel)`, 0.85);
  await sleep(0);
  if (autoOverlayAbort) return null;
  const subRotDeg = best.rotDeg + subRot;
  const subScl = best.scale + subScale;
  const sub = ev.evalSubpixel(subRotDeg, subScl);
  if (sub.score >= best.score - 0.01) best = sub;
  else best = { ...best, rotDeg: subRotDeg, scale: subScl };

  // Apply
  const before = { cx: sel.cx, cy: sel.cy, rotation: sel.rotation, scale: sel.scale };
  applyTransformToLayer(sel, refCenter,
    best.rotDeg * Math.PI / 180,
    best.scale,
    best.dx / ev.ppu,
    best.dy / ev.ppu);
  return {
    best,
    ppu: ev.ppu,
    refCenter,
    halfExtent,
    ev,
    score: best.score,
    delta: {
      cx: sel.cx - before.cx,
      cy: sel.cy - before.cy,
      rotDeg: (sel.rotation - before.rotation) * 180 / Math.PI,
      scaleRel: sel.scale / before.scale,
    },
  };
}

// Opportunistic snap check: try rounding the current layer state to common
// "nice" values (0/1°, integer pixels, scale 1.0, integer scale·100). For
// each variant, render the moving buffer with the snapped sel and re-score
// at zero shift; keep whichever variant scores highest. Cheap (~10 renders
// at SIZE=512) and reliably catches the true optimum when it sits on a
// clean architectural number.
async function snapCheck(ref, sel, refCenter, halfExtent) {
  if (autoOverlayAbort) return;
  const size = 512;
  const ev = buildEvaluator(ref, sel, refCenter, halfExtent, size);
  const saved = { cx: sel.cx, cy: sel.cy, rotation: sel.rotation, scale: sel.scale };
  const baseScore = ev.eval(0, 1).score;

  const rotDeg = saved.rotation * 180 / Math.PI;
  const round = (v, step) => Math.round(v / step) * step;

  // Find the nearest cardinal rotation (0°, ±90°, ±180°, ±270°) that's
  // within 15° of the current rotation. Architects regularly rotate plans
  // by exactly 90° to reorient portrait/landscape, so these are worth
  // snapping to when nearby.
  let nearestCardinalDeg = null;
  for (const cardinal of [0, 90, -90, 180, -180, 270, -270]) {
    if (Math.abs(rotDeg - cardinal) < 15) { nearestCardinalDeg = cardinal; break; }
  }

  const tries = [
    { cx: Math.round(saved.cx), cy: Math.round(saved.cy), rotation: saved.rotation, scale: saved.scale },
    { cx: saved.cx, cy: saved.cy, rotation: round(rotDeg, 0.1) * Math.PI / 180, scale: saved.scale },
    { cx: saved.cx, cy: saved.cy, rotation: round(rotDeg, 0.5) * Math.PI / 180, scale: saved.scale },
    { cx: saved.cx, cy: saved.cy, rotation: 0, scale: saved.scale },
    { cx: saved.cx, cy: saved.cy, rotation: saved.rotation, scale: round(saved.scale, 0.001) },
    { cx: saved.cx, cy: saved.cy, rotation: saved.rotation, scale: round(saved.scale, 0.01) },
    { cx: saved.cx, cy: saved.cy, rotation: saved.rotation, scale: 1 },
    { cx: Math.round(saved.cx), cy: Math.round(saved.cy), rotation: round(rotDeg, 0.1) * Math.PI / 180, scale: round(saved.scale, 0.001) },
    { cx: 0, cy: 0, rotation: 0, scale: 1 },
  ];
  // Add a cardinal-rotation snap if we're close to ±90/180/270 — common
  // when re-orienting a portrait crop to a landscape source.
  if (nearestCardinalDeg !== null && nearestCardinalDeg !== 0) {
    tries.push({ cx: saved.cx, cy: saved.cy, rotation: nearestCardinalDeg * Math.PI / 180, scale: saved.scale });
  }

  let bestScore = baseScore;
  let bestState = saved;
  for (const cand of tries) {
    if (autoOverlayAbort) break;
    sel.cx = cand.cx; sel.cy = cand.cy;
    sel.rotation = cand.rotation; sel.scale = cand.scale;
    const sc = ev.eval(0, 1).score;
    if (sc > bestScore + 1e-5) {
      bestScore = sc;
      bestState = cand;
    }
  }
  sel.cx = bestState.cx; sel.cy = bestState.cy;
  sel.rotation = bestState.rotation; sel.scale = bestState.scale;
}

async function autoOverlay() {
  const sel = currentLayer();
  if (!sel) return;
  const selIdx = state.layers.findIndex(l => l.id === sel.id);
  const refIdx = selIdx - 1 >= 0 ? selIdx - 1 : (state.layers.length > 1 ? state.layers.findIndex(l => l.id !== sel.id) : -1);
  if (refIdx < 0) return;
  const ref = state.layers[refIdx];

  autoOverlayAbort = false;
  $('status-stop').style.display = '';

  const MAX_PASSES = 10;
  let firstScore = null;
  let lastResult = null;
  let prevScore = -Infinity;
  let stagnantPasses = 0;

  for (let pass = 1; pass <= MAX_PASSES; pass++) {
    if (autoOverlayAbort) break;
    const mode = pass === 1 ? 'broad' : 'refine';
    const prefix = `Auto-overlay pass ${pass}/${MAX_PASSES}`;
    showStatus(prefix, (pass - 1) / MAX_PASSES);
    const r = await autoOverlayPass(ref, sel, mode, prefix);
    if (autoOverlayAbort) break;
    if (!r) break;
    if (firstScore === null) firstScore = r.score;
    lastResult = r;
    render();

    // Snap-rounded probe between passes — opportunistically catches "clean"
    // optima the FFT landscape's noise floor would otherwise hide.
    showStatus(`${prefix} (snap probe)`, (pass - 0.2) / MAX_PASSES);
    await sleep(0);
    if (autoOverlayAbort) break;
    await snapCheck(ref, sel, r.refCenter, r.halfExtent);
    render();
    syncPropsInputs();

    // Convergence: stop early when either (a) the per-pass deltas are tiny,
    // or (b) the score isn't meaningfully improving anymore. The second
    // criterion catches the case where the algorithm is bouncing within a
    // small basin without ever quite hitting the convergence thresholds.
    if (pass >= 2) {
      const d = r.delta;
      const tinyMove = Math.abs(d.cx) < 0.15 && Math.abs(d.cy) < 0.15;
      const tinyRot = Math.abs(d.rotDeg) < 0.005;
      const tinyScale = Math.abs(d.scaleRel - 1) < 5e-5;
      if (tinyMove && tinyRot && tinyScale) break;
      if (r.score < prevScore + 0.00005) stagnantPasses++;
      else stagnantPasses = 0;
      if (stagnantPasses >= 2) break;
    }
    prevScore = r.score;
  }

  $('status-stop').style.display = 'none';
  hideStatus();
  if (lastResult) {
    window._lastAutoOverlay = { best: lastResult.best };
  }

  // Only warn if the FINAL score is still poor after all the refinement
  // passes — a low first-pass score is fine if iteration recovers it
  // (common when most pixels are hidden by color filters).
  const finalScore = lastResult?.score ?? -Infinity;
  if (finalScore < 0.25 && !autoOverlayAbort) {
    alert(`Auto-overlay couldn't find a confident alignment (final score ${finalScore.toFixed(2)}). The layers may not share enough visible structure — try unhiding more colors.`);
  }

  renderProps();
  syncPropsInputs();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

$('btn-auto-overlay').addEventListener('click', () => {
  autoOverlay().catch(err => {
    console.error(err);
    hideStatus();
    $('status-stop').style.display = 'none';
    alert('Auto-overlay failed: ' + err.message);
  });
});

$('status-stop').addEventListener('click', () => {
  autoOverlayAbort = true;
  $('status-text').textContent = 'Stopping...';
});

// ===== Canvas background controls =====
function setBackgroundMode(mode) {
  state.backgroundMode = mode;
  document.querySelectorAll('.canvas-bg-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.bg === mode);
  });
  render();
}

document.querySelectorAll('.canvas-bg-btn').forEach(btn => {
  btn.addEventListener('click', e => {
    // The custom-color swatch holds the native picker as an absolutely-
    // positioned input; clicking the button forwards to the picker via
    // the input's own click. Just set the mode and let the input's
    // change event update the color.
    setBackgroundMode(btn.dataset.bg);
  });
});

$('bg-custom-input').addEventListener('input', e => {
  state.backgroundCustom = e.target.value;
  const customBtn = document.querySelector('.canvas-bg-btn.custom');
  if (customBtn) customBtn.style.background = e.target.value;
  if (state.backgroundMode === 'custom') render();
});

$('bg-custom-input').addEventListener('change', e => {
  // Also switch to custom mode if the user picked a color while another
  // mode was active — the picker click is interpreted as choosing custom.
  setBackgroundMode('custom');
});

// ===== Initial setup =====
resizeCanvas();
renderLayersList();
renderProps();
updateToolbar();

// Expose for testing
window._state = state;
window._addFiles = addFiles;
window._buildEvaluator = buildEvaluator;
window._renderLayerToGrayBuffer = renderLayerToGrayBuffer;
window._sobelEdges = sobelEdges;
window._alignmentScore = alignmentScore;
window._phaseCorrelation = phaseCorrelation;
window._applyHannAndFFT = applyHannAndFFT;
</script>
